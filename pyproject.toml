[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "trainscale-lab"
version = "0.1.0"
description = "A verifiable, experiment-driven PyTorch training systems lab"
readme = "README.md"
requires-python = ">=3.11,<3.12"
license = "Apache-2.0"
license-files = ["LICENSE"]
dependencies = ["numpy>=1.26,<3", "psutil>=6,<8"]

[project.optional-dependencies]
cpu = ["torch==2.12.1", "torchvision==0.27.1"]
cu129 = ["torch==2.12.1", "torchvision==0.27.1"]
dev = ["mypy>=1.15,<2", "pytest>=8.3,<10", "ruff>=0.11,<1", "types-psutil>=7,<8"]

[project.scripts]
trainscale-benchmark-modes = 'trainscale_training.benchmark_modes:main'
trainscale-benchmark-image-workers = 'trainscale_training.benchmark_image_workers:main'
trainscale-train = "trainscale_training.train:main"
trainscale-benchmark = "trainscale_training.benchmark:main"
trainscale-benchmark-workers = "trainscale_training.benchmark_workers:main"
trainscale-profile = "trainscale_training.profile:main"
trainscale-plot = "trainscale_training.plot:main"
trainscale-summarize = "trainscale_training.summarize:main"

[tool.hatch.build.targets.wheel]
packages = ["01_pytorch_training/trainscale_training"]

[tool.pytest.ini_options]
addopts = "-ra"
testpaths = [
  "01_pytorch_training/tests",
  "02_gpu_kernels/tests",
  "03_distributed_training/tests",
  "04_nccl_benchmark/tests",
  "05_tiny_collective/tests",
  "06_training_engine/tests",
  "07_parallelism/tests",
]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.11"
files = [
  "01_pytorch_training/trainscale_training",
  "03_distributed_training/trainscale_distributed",
  "03_distributed_training/benchmarks",
  "04_nccl_benchmark/trainscale_nccl",
  "04_nccl_benchmark/benchmarks",
  "05_tiny_collective/trainscale_collective",
  "05_tiny_collective/benchmarks",
  "06_training_engine/trainscale_engine",
  "06_training_engine/benchmarks",
  "07_parallelism/trainscale_parallel",
  "07_parallelism/benchmarks",
  "benchmarks/artifact_contract.py",
  "benchmarks/torchrun_launcher.py",
]
check_untyped_defs = true
warn_unused_ignores = true

[tool.uv]
conflicts = [[{ extra = "cpu" }, { extra = "cu129" }]]

[tool.uv.sources]
torch = [
  { index = "pytorch-cpu", extra = "cpu" },
  { index = "pytorch-cu129", extra = "cu129" },
]
torchvision = [
  { index = "pytorch-cpu", extra = "cpu" },
  { index = "pytorch-cu129", extra = "cu129" },
]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[[tool.uv.index]]
name = "pytorch-cu129"
url = "https://download.pytorch.org/whl/cu129"
explicit = true
