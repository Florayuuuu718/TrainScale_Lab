# Run this unchanged three times on one clean, frozen multi-GPU host.

[[case]]
id = "all_reduce_pair01"
collective = "all_reduce"
devices = [0, 1]
min_bytes = 8
max_bytes = 268435456
step_factor = 2
warmup_iterations = 5
measured_iterations = 20
dtype = "float"

