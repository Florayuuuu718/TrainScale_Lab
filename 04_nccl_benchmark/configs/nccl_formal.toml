# These cases require four visible GPUs. pair02 must be interpreted with the
# archived topology rather than assumed to be a cross-NUMA path.
[[case]]
id = "all_reduce_pair02"
collective = "all_reduce"
devices = [0, 2]
min_bytes = 8
max_bytes = 268435456
